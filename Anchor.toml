[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[test]
upgradeable = true

[programs.localnet]
strategy = "4jCQAmUGnZpFGHhZkMQ53PUYRPpzXEA7QzsbiK6Zh6P3"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""
